name: Build unsigned device IPA (for sideloading)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Sideloadly 用你的 Apple ID 重新签名时会把 Team ID 追加到 bundle id 后面；
  # 这里把它写成常量，既用于 Info.plist 的钥匙串组，也用于 entitlements。
  GOUTOU_TEAM_ID: "7S8RQQ2V6C"
  GOUTOU_APP_GROUP: "group.ai.goutoujunshi.chatios"
  GOUTOU_APP_BUNDLE: "ai.goutoujunshi.chatios"

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/jev_ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Patch credential storage (App Group mirror, no hardcoded keychain group)
        run: |
          python3 - <<'PY'
          import sys
          path = "Shared/Store.swift"
          lines = open(path, encoding="utf-8").read().split("\n")

          hit = 0
          for i, l in enumerate(lines):
              if "kSecAttrAccessGroup as String: group]" in l:
                  lines[i] = l.replace(", kSecAttrAccessGroup as String: group]", "]")
                  hit += 1
          if hit != 1:
              sys.exit("anchor access-group count = %d" % hit)

          exact = {
              "    static func read(_ name: String) throws -> String {": "    private static func keychainRead(_ name: String) throws -> String {",
              "    static func write(_ value: String, name: String) throws {": "    private static func keychainWrite(_ value: String, name: String) throws {",
              "    static func delete(_ name: String) throws {": "    private static func keychainDelete(_ name: String) throws {",
          }
          for i, l in enumerate(lines):
              if l in exact:
                  lines[i] = exact[l]

          insert_at = None
          for i, l in enumerate(lines):
              if "private static func keychainDelete(_ name: String) throws {" in l:
                  j = i
                  while j < len(lines) and not lines[j].startswith("    #else"):
                      j += 1
                  insert_at = j
                  break
          if insert_at is None:
              sys.exit("insert anchor not found")

          wrappers = [
              '    private static var mirror: UserDefaults? {',
              '        guard let group = Bundle.main.object(forInfoDictionaryKey: "GoutouAppGroup") as? String, !group.isEmpty else { return nil }',
              '        return UserDefaults(suiteName: group)',
              '    }',
              '    private static func mirrorKey(_ name: String) -> String { "goutou.secret." + name }',
              '    static func read(_ name: String) throws -> String {',
              '        if let value = try? keychainRead(name), !value.isEmpty { return value }',
              '        return mirror?.string(forKey: mirrorKey(name)) ?? ""',
              '    }',
              '    static func write(_ value: String, name: String) throws {',
              '        let value = value.trimmed',
              '        guard !value.isEmpty, value.count <= 1024 else { throw GoutouError.invalid("请输入有效的 API Key") }',
              '        let saved = (try? keychainWrite(value, name: name)) != nil',
              '        mirror?.set(value, forKey: mirrorKey(name))',
              '        guard saved || mirror != nil else { throw GoutouError.invalid("密钥保存失败，请检查共享钥匙串签名") }',
              '    }',
              '    static func delete(_ name: String) throws {',
              '        try? keychainDelete(name)',
              '        mirror?.removeObject(forKey: mirrorKey(name))',
              '    }',
          ]
          lines[insert_at:insert_at] = wrappers
          open(path, "w", encoding="utf-8").write("\n".join(lines))
          print("patched", path, len(lines), "lines")
          PY

      - name: Build device app without signing (Release)
        run: >
          xcodebuild -project GoutouJunshi.xcodeproj -scheme GoutouJunshi
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      - name: Bake team-prefixed keychain group into Info.plist and entitlements
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/GoutouJunshi.app"
          KBD="$APP/PlugIns/GoutouKeyboard.appex"
          CAP="$APP/PlugIns/GoutouCapture.appex"
          test -d "$APP"
          KEYCHAIN_GROUP="${GOUTOU_TEAM_ID}.${GOUTOU_APP_BUNDLE}"
          echo "keychain group = $KEYCHAIN_GROUP"
          /usr/libexec/PlistBuddy -c "Set :GoutouKeychainGroup $KEYCHAIN_GROUP" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :GoutouKeychainGroup $KEYCHAIN_GROUP" "$KBD/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :GoutouKeychainGroup" "$APP/Info.plist"
          make_ent() {
            local out="$1"
            local with_keychain="$2"
            {
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
              printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              printf '%s\n' '<plist version="1.0"><dict>'
              printf '%s\n' '  <key>com.apple.security.application-groups</key>'
              printf '%s\n' '  <array><string>'"$GOUTOU_APP_GROUP"'</string></array>'
              if [ "$with_keychain" = "yes" ]; then
                printf '%s\n' '  <key>keychain-access-groups</key>'
                printf '%s\n' '  <array><string>'"$KEYCHAIN_GROUP"'</string></array>'
              fi
              printf '%s\n' '</dict></plist>'
            } > "$out"
          }
          make_ent /tmp/ent-app.plist yes
          make_ent /tmp/ent-ext.plist yes
          make_ent /tmp/ent-capture.plist no
          for ext in "$KBD" "$CAP"; do
            case "$ext" in
              *GoutouCapture.appex) ent=/tmp/ent-capture.plist ;;
              *) ent=/tmp/ent-ext.plist ;;
            esac
            codesign --force --sign - --timestamp=none --entitlements "$ent" "$ext"
          done
          codesign --force --sign - --timestamp=none --entitlements /tmp/ent-app.plist "$APP"
          echo "--- 主 App entitlements ---"
          codesign -d --entitlements :- "$APP" || true
          echo "--- 键盘 entitlements ---"
          codesign -d --entitlements :- "$KBD" || true

      - name: Package Payload/GoutouJunshi.ipa
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/GoutouJunshi.app"
          test -d "$APP"
          rm -rf Payload goutoujunshi-unsigned-ios.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry goutoujunshi-unsigned-ios.ipa Payload
          lipo -info "$APP/GoutouJunshi" || true
          find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print || true
          ls -lh goutoujunshi-unsigned-ios.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-unsigned-ios-ipa
          path: integrations/jev_ios/goutoujunshi-unsigned-ios.ipa
          if-no-files-found: error
