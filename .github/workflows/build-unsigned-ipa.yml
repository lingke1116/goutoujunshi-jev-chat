name: Build unsigned device IPA (for sideloading)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Sideloadly 用你的 Apple ID 重新签名时会把 Team ID 追加到 bundle id 后面；
  # 这里把它写成常量，既用于 Info.plist 的钥匙串组，也用于 entitlements。
  GOUTOU_TEAM_ID: "7S8RQQ2V6C"
  GOUTOU_APP_GROUP: "group.ai.goutoujunshi.chatios"
  GOUTOU_APP_BUNDLE: "ai.goutoujunshi.chatios"

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/jev_ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Patch app to work without App Group (container fallback + clipboard bootstrap)
        run: |
          python3 - <<'PY'
          import sys
          NL = chr(10)

          def read(p):
              return open(p, encoding="utf-8").read()

          def write(p, text):
              open(p, "w", encoding="utf-8").write(text)

          # ---- 1) Shared/Store.swift: App Group 变可选 ----
          store = "Shared/Store.swift"
          src = read(store)
          old_init = '''        #if os(iOS)
                  guard let container = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: Self.group),
                        let defaults = UserDefaults(suiteName: Self.group) else {
                      throw GoutouError.invalid("共享配置未连接：请在 Xcode 为 App 与键盘配置相同 App Group 和开发者 Team")
                  }
                  self.container = container
                  self.defaults = defaults
                  #else'''
          new_init = '''        #if os(iOS)
                  if let groupContainer = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: Self.group),
                     let groupDefaults = UserDefaults(suiteName: Self.group) {
                      self.container = groupContainer
                      self.defaults = groupDefaults
                  } else {
                      let fallback = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask).first ?? FileManager.default.temporaryDirectory
                      self.container = fallback
                      self.defaults = UserDefaults.standard
                  }
                  #else'''
          if old_init not in src:
              sys.exit("store init anchor missing")
          src = src.replace(old_init, new_init, 1)
          write(store, src)

          # ---- 1b) 追加剪贴板兜底通道 ----
          bootstrap = '''

          #if os(iOS) && !GOUTOU_CAPTURE
          import UIKit

          /// App Group 不可用时的兜底：主 App 把配置与 Key 复制到剪贴板，键盘读取后存进自己的容器和钥匙串。
          enum GoutouBootstrap {
              static let marker = "goutou-bootstrap-1"

              struct Payload: Codable {
                  var marker: String
                  var savedAt: Date
                  var config: AppConfig
                  var relationship: Relationship
                  var secrets: [String: String]
              }

              static func copyToPasteboard(store: GoutouStore) -> Bool {
                  var secrets: [String: String] = [:]
                  for name in CredentialVault.services {
                      secrets[name] = (try? CredentialVault.read(name)) ?? ""
                  }
                  let payload = Payload(marker: marker, savedAt: Date(), config: store.config(),
                                        relationship: store.relationship(), secrets: secrets)
                  guard let data = try? JSONEncoder().encode(payload), let text = String(data: data, encoding: .utf8) else { return false }
                  UIPasteboard.general.string = text
                  return true
              }

              @discardableResult
              static func importIfNewer(into store: GoutouStore) -> Bool {
                  guard let text = UIPasteboard.general.string, let data = text.data(using: .utf8),
                        let payload = try? JSONDecoder().decode(Payload.self, from: data), payload.marker == marker else { return false }
                  guard payload.savedAt > store.bootstrapImportedAt else { return false }
                  _ = try? store.saveConfig(payload.config)
                  _ = try? store.saveRelationship(payload.relationship, archive: true)
                  for (name, value) in payload.secrets where !value.trimmed.isEmpty {
                      _ = try? CredentialVault.write(value, name: name)
                  }
                  store.bootstrapImportedAt = payload.savedAt
                  return true
              }
          }

          extension GoutouStore {
              var bootstrapImportedAt: Date {
                  get { defaults.object(forKey: "goutou.bootstrap.importedAt") as? Date ?? Date(timeIntervalSince1970: 0) }
                  set { defaults.set(newValue, forKey: "goutou.bootstrap.importedAt") }
              }
          }
          #endif
          '''
          write(store, read(store) + bootstrap)

          # ---- 2) 键盘启动时自动从剪贴板导入 ----
          kb = "Keyboard/Sources/KeyboardViewController.swift"
          src = read(kb)
          anchor = "            store = try GoutouStore()"
          if anchor not in src:
              sys.exit("keyboard anchor missing")
          src = src.replace(anchor, anchor + NL + "            if let active = store { _ = GoutouBootstrap.importIfNewer(into: active) }", 1)
          write(kb, src)

          # ---- 3) 主 App 增加复制配置按钮 ----
          sv = "App/Sources/SettingsViews.swift"
          src = read(sv)
          anchor2 = '                Button("清除键盘暂存与等待取用的内容") {'
          if anchor2 not in src:
              sys.exit("settings anchor missing")
          button = '                Button("复制配置给键盘（无 App Group 时用）") {' + NL
          button += '                    if let store = model.store, GoutouBootstrap.copyToPasteboard(store: store) {' + NL
          button += '                        message = "已复制配置到剪贴板；切到键盘会自动导入。"' + NL
          button += '                    } else {' + NL
          button += '                        message = "共享配置未连接，复制失败。"' + NL
          button += '                    }' + NL
          button += '                }' + NL
          src = src.replace(anchor2, button + anchor2, 1)
          write(sv, src)

          # ---- 4) 钥匙串查询不再指定 access group（否则 Sideloadly/iloader 签名时必然 -34018）----
          src = read(store)
          old_q = 'kSecAttrAccount as String: "default", kSecAttrAccessGroup as String: group]'
          new_q = 'kSecAttrAccount as String: "default"]'
          if old_q not in src:
              sys.exit("keychain anchor missing")
          src = src.replace(old_q, new_q, 1)
          write(store, src)
          print("keychain access group removed")

          print("patched for no-App-Group mode")
          PY
      - name: Build device app without signing (Release)
        run: >
          xcodebuild -project GoutouJunshi.xcodeproj -scheme GoutouJunshi
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      - name: Bake team-prefixed keychain group into Info.plist and entitlements
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/GoutouJunshi.app"
          KBD="$APP/PlugIns/GoutouKeyboard.appex"
          CAP="$APP/PlugIns/GoutouCapture.appex"
          test -d "$APP"
          KEYCHAIN_GROUP="${GOUTOU_TEAM_ID}.${GOUTOU_APP_BUNDLE}"
          echo "keychain group = $KEYCHAIN_GROUP"
          /usr/libexec/PlistBuddy -c "Set :GoutouKeychainGroup $KEYCHAIN_GROUP" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :GoutouKeychainGroup $KEYCHAIN_GROUP" "$KBD/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :GoutouKeychainGroup" "$APP/Info.plist"

          # AltStore/AltSign 注册 App ID 时会用 App 名称，含中文会报错 3009（The name for this app is invalid）。
          # 这里把基础名称改成 ASCII，同时补一份 zh-Hans 本地化，手机上仍显示「狗头军师」。
          rename_bundle() {
            local bundle="$1"; local ascii="$2"; local zh="$3"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $ascii" "$bundle/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleName $ascii" "$bundle/Info.plist"
            mkdir -p "$bundle/zh-Hans.lproj"
            printf '"CFBundleDisplayName" = "%s";\n"CFBundleName" = "%s";\n' "$zh" "$zh" > "$bundle/zh-Hans.lproj/InfoPlist.strings"
          }
          rename_bundle "$APP" "Goutou" "狗头军师"
          rename_bundle "$KBD" "GoutouKeyboard" "狗头军师"
          rename_bundle "$CAP" "GoutouCapture" "狗头军师"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          make_ent() {
            local out="$1"
            local with_keychain="$2"
            {
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
              printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              printf '%s\n' '<plist version="1.0"><dict>'
              printf '%s\n' '  <key>com.apple.security.application-groups</key>'
              printf '%s\n' '  <array><string>'"$GOUTOU_APP_GROUP"'</string></array>'
              if [ "$with_keychain" = "yes" ]; then
                printf '%s\n' '  <key>keychain-access-groups</key>'
                printf '%s\n' '  <array><string>'"$KEYCHAIN_GROUP"'</string></array>'
              fi
              printf '%s\n' '</dict></plist>'
            } > "$out"
          }
          make_ent /tmp/ent-app.plist yes
          make_ent /tmp/ent-ext.plist yes
          make_ent /tmp/ent-capture.plist no
          for ext in "$KBD" "$CAP"; do
            case "$ext" in
              *GoutouCapture.appex) ent=/tmp/ent-capture.plist ;;
              *) ent=/tmp/ent-ext.plist ;;
            esac
            codesign --force --sign - --timestamp=none --entitlements "$ent" "$ext"
          done
          codesign --force --sign - --timestamp=none --entitlements /tmp/ent-app.plist "$APP"
          echo "--- 主 App entitlements ---"
          codesign -d --entitlements :- "$APP" || true
          echo "--- 键盘 entitlements ---"
          codesign -d --entitlements :- "$KBD" || true

      - name: Package Payload/GoutouJunshi.ipa
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/GoutouJunshi.app"
          test -d "$APP"
          rm -rf Payload goutoujunshi-unsigned-ios.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry goutoujunshi-unsigned-ios.ipa Payload
          lipo -info "$APP/GoutouJunshi" || true
          find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print || true
          ls -lh goutoujunshi-unsigned-ios.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-unsigned-ios-ipa
          path: integrations/jev_ios/goutoujunshi-unsigned-ios.ipa
          if-no-files-found: error
