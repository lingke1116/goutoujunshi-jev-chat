name: Build unsigned device IPA (for sideloading)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/jev_ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build device app without signing (Release)
        run: >
          xcodebuild -project GoutouJunshi.xcodeproj -scheme GoutouJunshi
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      - name: Package Payload/GoutouJunshi.ipa
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/GoutouJunshi.app"
          test -d "$APP"
          rm -rf Payload goutoujunshi-unsigned-ios.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry goutoujunshi-unsigned-ios.ipa Payload
          echo "--- architectures ---"
          lipo -info "$APP/GoutouJunshi" || true
          echo "--- embedded extensions ---"
          find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print || true
          ls -lh goutoujunshi-unsigned-ios.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-unsigned-ios-ipa
          path: integrations/jev_ios/goutoujunshi-unsigned-ios.ipa
          if-no-files-found: error
