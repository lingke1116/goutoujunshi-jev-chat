name: Build unsigned device IPA (for sideloading)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Sideloadly 用你的 Apple ID 重新签名时，Team ID 会被追加到 bundle id 后面，
  # 这里预先把它写进 Info.plist 和 entitlements，让 App 与键盘用同一个钥匙串组。
  GOUTOU_TEAM_ID: "7S8RQQ2V6C"
  GOUTOU_APP_GROUP: "group.ai.goutoujunshi.chatios"
  GOUTOU_APP_BUNDLE: "ai.goutoujunshi.chatios"

jobs:
  unsigned-ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: integrations/jev_ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build device app without signing (Release)
        run: >
          xcodebuild -project GoutouJunshi.xcodeproj -scheme GoutouJunshi
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build-device
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build

      - name: Bake team-prefixed keychain group into Info.plist and entitlements
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/GoutouJunshi.app"
          KBD="$APP/PlugIns/GoutouKeyboard.appex"
          CAP="$APP/PlugIns/GoutouCapture.appex"
          test -d "$APP"
          KEYCHAIN_GROUP="${GOUTOU_TEAM_ID}.${GOUTOU_APP_BUNDLE}"
          echo "keychain group = $KEYCHAIN_GROUP"

          # 1) Info.plist：让 App 与键盘请求同一个钥匙串组（源码里读的就是这个键）
          /usr/libexec/PlistBuddy -c "Set :GoutouKeychainGroup $KEYCHAIN_GROUP" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :GoutouKeychainGroup $KEYCHAIN_GROUP" "$KBD/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :GoutouKeychainGroup" "$APP/Info.plist"

          # 2) entitlements
          make_ent() {
            local out="$1"
            local with_keychain="$2"
            {
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
              printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              printf '%s\n' '<plist version="1.0"><dict>'
              printf '%s\n' '  <key>com.apple.security.application-groups</key>'
              printf '%s\n' '  <array><string>'"$GOUTOU_APP_GROUP"'</string></array>'
              if [ "$with_keychain" = "yes" ]; then
                printf '%s\n' '  <key>keychain-access-groups</key>'
                printf '%s\n' '  <array><string>'"$KEYCHAIN_GROUP"'</string></array>'
              fi
              printf '%s\n' '</dict></plist>'
            } > "$out"
          }
          make_ent /tmp/ent-app.plist yes
          make_ent /tmp/ent-ext.plist yes
          make_ent /tmp/ent-capture.plist no

          # 3) 由内向外 ad-hoc 签名（先扩展后主 App）
          for ext in "$KBD" "$CAP"; do
            case "$ext" in
              *GoutouCapture.appex) ent=/tmp/ent-capture.plist ;;
              *) ent=/tmp/ent-ext.plist ;;
            esac
            codesign --force --sign - --timestamp=none --entitlements "$ent" "$ext"
          done
          codesign --force --sign - --timestamp=none --entitlements /tmp/ent-app.plist "$APP"

          echo "--- 主 App entitlements ---"
          codesign -d --entitlements :- "$APP" || true
          echo "--- 键盘 entitlements ---"
          codesign -d --entitlements :- "$KBD" || true

      - name: Package Payload/GoutouJunshi.ipa
        run: |
          set -euo pipefail
          APP="build-device/Build/Products/Release-iphoneos/GoutouJunshi.app"
          test -d "$APP"
          rm -rf Payload goutoujunshi-unsigned-ios.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry goutoujunshi-unsigned-ios.ipa Payload
          echo "--- architectures ---"
          lipo -info "$APP/GoutouJunshi" || true
          echo "--- embedded extensions ---"
          find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print || true
          ls -lh goutoujunshi-unsigned-ios.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: goutoujunshi-unsigned-ios-ipa
          path: integrations/jev_ios/goutoujunshi-unsigned-ios.ipa
          if-no-files-found: error
